name: Pull Instagram Stats

on:
  schedule:
    # Daily, not more frequent - a full N-day pull makes many API calls
    # (one insights call per post), so stay well within rate limits.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pull mode"
        required: true
        default: "days"
        type: choice
        options:
          - days
          - posts
          - date
      value:
        description: "Value for mode: a positive integer for days/posts, or YYYY-MM-DD for date"
        required: true
        default: "30"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Write token.json from secret
        run: printf '%s' "$INSTAGRAM_TOKEN_JSON" > token.json
        env:
          INSTAGRAM_TOKEN_JSON: ${{ secrets.INSTAGRAM_TOKEN_JSON }}

      - name: Refresh access token
        run: python refreshToken.py

      - name: Save refreshed token back to the repo secret
        run: gh secret set INSTAGRAM_TOKEN_JSON < token.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Pull stats
        run: >
          python pullData.py
          --mode "${{ github.event.inputs.mode || 'days' }}"
          --value "${{ github.event.inputs.value || '30' }}"

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statsHistory.json
          git diff --cached --quiet || git commit -m "Automated stats pull"
          git push
